<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#25324A">
<title>美股記帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --paper:#F5F0E1; --paper-line:#DDD3B4; --card:#FBF8EF;
    --ink:#25324A; --ink-soft:#6B7186; --ink-faint:#9B9583;
    --gold:#9C7A2E; --gold-soft:#C7A94F;
    --red:#B4362A; --red-bg:#F3E2DE;
    --green:#2F6E4F; --green-bg:#E1EBE1;
    --stamp:#A83A2E; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);background-image:repeating-linear-gradient(transparent, transparent 27px, var(--paper-line) 28px);color:var(--ink);font-family:'Noto Sans TC','Noto Sans',sans-serif;padding:24px 14px 60px;}
  .wrap{max-width:600px;margin:0 auto;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--ink-faint);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  h1{font-family:'Noto Serif TC',serif;font-weight:700;font-size:26px;margin:0 0 14px;letter-spacing:.02em;}
  .tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px;}
  .tab-btn{font-family:'Noto Sans TC',sans-serif;font-size:13px;font-weight:500;padding:8px 14px;border-radius:999px;border:1px solid var(--paper-line);background:var(--card);color:var(--ink-soft);cursor:pointer;white-space:nowrap;flex-shrink:0;}
  .tab-btn.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .view{display:none;} .view.active{display:block;}
  .hero{position:relative;background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);padding:22px 20px 20px;margin-bottom:16px;overflow:hidden;}
  .hero-label{font-size:13px;color:var(--ink-soft);margin-bottom:6px;}
  .hero-value{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:32px;letter-spacing:-.01em;}
  .badge{display:inline-flex;align-items:center;gap:4px;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;padding:3px 9px;border-radius:999px;margin-top:10px;}
  .up{color:var(--red);background:var(--red-bg);} .down{color:var(--green);background:var(--green-bg);}
  .stamp{position:absolute;top:16px;right:18px;width:60px;height:60px;border-radius:50%;border:2px solid var(--stamp);color:var(--stamp);display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:'Noto Serif TC',serif;font-weight:700;font-size:10px;line-height:1.3;transform:rotate(-9deg);opacity:.75;text-align:center;}
  .stamp small{font-size:9px;font-weight:500;letter-spacing:.06em;}
  .section-title{font-family:'Noto Serif TC',serif;font-size:14px;font-weight:700;color:var(--ink-soft);margin:20px 2px 8px;display:flex;align-items:center;gap:8px;}
  .section-title::after{content:'';flex:1;height:1px;background:var(--paper-line);}
  .ledger{background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);overflow:hidden;}
  .row{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px dashed var(--paper-line);}
  .row:last-child{border-bottom:none;}
  .row-name{font-size:14px;font-weight:500;}
  .row-right{text-align:right;}
  .row-value{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:500;}
  .row-chg{font-family:'JetBrains Mono',monospace;font-size:11.5px;margin-top:2px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat{background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);padding:14px 15px;}
  .stat-label{font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
  .stat-usd{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;}
  .stat-twd{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .stat-pct{font-family:'JetBrains Mono',monospace;font-size:11.5px;margin-top:6px;display:inline-block;}
  .tblwrap{overflow-x:auto;border:1px solid var(--paper-line);border-radius:var(--radius);background:var(--card);}
  table{border-collapse:collapse;width:100%;font-size:12.5px;}
  th{font-family:'Noto Sans TC',sans-serif;font-weight:500;color:var(--ink-soft);text-align:right;padding:9px 10px;border-bottom:1px solid var(--paper-line);white-space:nowrap;background:var(--card);}
  th:first-child, td:first-child{text-align:left;}
  td{font-family:'JetBrains Mono',monospace;text-align:right;padding:8px 10px;border-bottom:1px dashed var(--paper-line);white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  .pos{color:var(--red);} .neg{color:var(--green);}
  .type-buy{color:var(--red);font-family:'Noto Sans TC',sans-serif;font-size:11.5px;}
  .type-sell{color:var(--green);font-family:'Noto Sans TC',sans-serif;font-size:11.5px;}
  .type-split{color:var(--gold);font-family:'Noto Sans TC',sans-serif;font-size:11.5px;}
  .chart-box{background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);padding:16px;position:relative;height:240px;}
  .foot-note{font-size:11.5px;color:var(--ink-faint);text-align:center;margin-top:10px;}
  .cell-input{width:74px;font-family:'JetBrains Mono',monospace;font-size:12.5px;text-align:right;border:1px solid var(--paper-line);border-radius:6px;padding:3px 6px;background:#fff;color:var(--ink);}
  .form-card{background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);padding:14px 15px;margin-bottom:14px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
  .form-grid label{font-size:11px;color:var(--ink-soft);display:block;margin-bottom:3px;}
  .form-grid input,.form-grid select{width:100%;font-family:'JetBrains Mono',monospace;font-size:13px;border:1px solid var(--paper-line);border-radius:8px;padding:7px 8px;background:#fff;color:var(--ink);}
  .btn{font-family:'Noto Sans TC',sans-serif;font-size:13px;font-weight:500;padding:9px 16px;border-radius:999px;border:1px solid var(--paper-line);background:var(--card);color:var(--ink);cursor:pointer;}
  .btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .btn.small{padding:4px 10px;font-size:11.5px;}
  .btn:active{transform:scale(.97);}
  .del-btn{color:var(--red);cursor:pointer;font-family:'Noto Sans TC',sans-serif;font-size:11.5px;background:none;border:none;padding:2px 4px;}
  textarea{width:100%;font-family:'JetBrains Mono',monospace;font-size:12px;border:1px solid var(--paper-line);border-radius:8px;padding:8px;background:#fff;color:var(--ink);min-height:70px;}
  .collapse-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:10px 2px;font-size:13px;font-weight:500;color:var(--ink-soft);}
  .save-hint{font-size:11.5px;color:var(--ink-faint);margin-top:8px;text-align:center;}
  .title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .title-row h1{margin:0;}
  .refresh-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--paper-line);background:var(--card);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
  .refresh-btn:active{transform:rotate(45deg);}
  .refresh-btn svg{width:18px;height:18px;}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:12.5px;padding:9px 16px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10;white-space:nowrap;}
  .toast.show{opacity:1;}
  .period-tabs{display:flex;gap:6px;margin-bottom:12px;}
  .period-btn{font-family:'JetBrains Mono',monospace;font-size:12px;padding:6px 12px;border-radius:999px;border:1px solid var(--paper-line);background:var(--card);color:var(--ink-soft);cursor:pointer;}
  .period-btn.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .hilo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
  .hilo-card{background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);padding:12px 14px;}
  .hilo-title{font-size:12px;color:var(--ink-soft);margin-bottom:8px;}
  .hilo-line{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:12px;padding:3px 0;}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow"><span>PASSBOOK / 資產總覽</span><span id="todayLabel"></span></div>
  <div class="title-row">
    <h1>美股記帳</h1>
    <div class="refresh-btn" id="refreshBtn" title="請 Claude 重新同步試算表">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <div class="tabs">
    <button class="tab-btn active" data-view="overview">總覽</button>
    <button class="tab-btn" data-view="holdings">持股明細</button>
    <button class="tab-btn" data-view="trend">走勢</button>
    <button class="tab-btn" data-view="tx">交易紀錄</button>
    <button class="tab-btn" data-view="div">股息紀錄</button>
    <button class="tab-btn" data-view="settings">設定</button>
  </div>

  <div class="view active" id="view-overview"></div>
  <div class="view" id="view-holdings"></div>
  <div class="view" id="view-trend">
    <div class="section-title">市值走勢（歷史快照）</div>
    <div class="period-tabs">
      <button class="period-btn" data-period="1M">1個月</button>
      <button class="period-btn active" data-period="3M">3個月</button>
      <button class="period-btn" data-period="6M">6個月</button>
      <button class="period-btn" data-period="YTD">YTD</button>
    </div>
    <div class="chart-box"><canvas id="trendChart"></canvas></div>
    <div class="hilo-grid" id="hiloGrid"></div>
    <div class="foot-note">紅線：美股市值（TWD）　藍線：台股市值（TWD）— 此圖為靜態歷史資料，不會隨新交易自動延伸。</div>
  </div>
  <div class="view" id="view-tx"></div>
  <div class="view" id="view-div"></div>
  <div class="view" id="view-settings"></div>

  <div class="save-hint" id="saveHint"></div>
</div>

document.querySelectorAll('.tab-btn').forEach(btn=>{

    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));

});

const isClaudeEnv = typeof window.storage !== 'undefined';

async function storageGet(key){
  if(isClaudeEnv){
    try{ const r = await window.storage.get(key, false); return r ? r.value : null; }catch(e){ return null; }
  } else {
    return localStorage.getItem(key);
  }
}
async function storageSet(key, value){
  if(isClaudeEnv){
    try{ await window.storage.set(key, value, false); return true; }catch(e){ return false; }
  } else {
    try{ localStorage.setItem(key, value); return true; }catch(e){ return false; }
  }
}

async function persist(){
  const ok = await storageSet('portfolio-state-v1', JSON.stringify(state));
  document.getElementById('saveHint').textContent = ok ? ('已自動儲存・' + new Date().toLocaleTimeString('zh-TW')) : '儲存失敗，請稍後再試';
}

async function loadState(){
  const raw = await storageGet('portfolio-state-v1');
  if(raw){ try{ state = JSON.parse(raw); if(state.finnhubKey===undefined) state.finnhubKey=''; return; }catch(e){} }
  seedState();
  await persist();
}

function computeHoldings(){
  const pos = {};
  const txs = [...state.txs].sort((a,b)=> a.d.localeCompare(b.d));
  txs.forEach(x=>{
    const key = x.account+':'+x.t;
    if(!pos[key]) pos[key] = { account:x.account, t:x.t, shares:0, avgCost:0, realized:0 };
    const p = pos[key];
    if(x.type === 'Buy'){
      const cost = x.shares*x.price + (x.fee||0);
      const newShares = p.shares + x.shares;
      p.avgCost = newShares>0 ? (p.avgCost*p.shares + cost) / newShares : 0;
      p.shares = newShares;
    } else if(x.type === 'Sell'){
      const proceeds = x.shares*x.price - (x.fee||0);
      p.realized += proceeds - p.avgCost*x.shares;
      p.shares -= x.shares;
    } else if(x.type === 'Split'){
      const ratio = x.price || 1;
      p.shares *= ratio;
      p.avgCost = ratio ? p.avgCost/ratio : p.avgCost;
    }
  });
  return Object.values(pos).filter(p => p.shares > 0.0001);
}

function priceOf(t){ return state.prices[t] !== undefined ? state.prices[t] : 0; }
function chgOf(t){ return state.chg[t] !== undefined ? state.chg[t] : 0; }

function computeRealizedUSD(){
  const pos = {};
  let realized = 0;
  const txs = [...state.txs].sort((a,b)=> a.d.localeCompare(b.d));
  txs.forEach(x=>{
    if(x.account !== 'JS-US') return;
    const key = x.t;
    if(!pos[key]) pos[key] = { shares:0, avgCost:0 };
    const p = pos[key];
    if(x.type === 'Buy'){
      const cost = x.shares*x.price + (x.fee||0);
      const newShares = p.shares + x.shares;
      p.avgCost = newShares>0 ? (p.avgCost*p.shares + cost) / newShares : 0;
      p.shares = newShares;
    } else if(x.type === 'Sell'){
      const proceeds = x.shares*x.price - (x.fee||0);
      realized += proceeds - p.avgCost*x.shares;
      p.shares -= x.shares;
    } else if(x.type === 'Split'){
      const ratio = x.price || 1;
      p.shares *= ratio; p.avgCost = ratio ? p.avgCost/ratio : p.avgCost;
    }
  });
  return realized;
}

function isTWTicker(t){ return /^\d/.test(t); }

async function fetchLiveQuotes(){
  const btn = document.getElementById('liveFetchBtn');
  const holdings = computeHoldings();
  const tickers = [...new Set(holdings.map(h=>h.t))];
  if(!state.finnhubKey && tickers.some(t=>!isTWTicker(t))){
    showToast('請先到「設定」分頁貼上你的 Finnhub API Key');
    return;
  }
  btn.textContent = '抓取中…';
  let okCount = 0, failCount = 0;
  for(const t of tickers){
    try{
      if(isTWTicker(t)){
        const url = `https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=tse_${t}.tw&json=1&delay=0`;
        const res = await fetch(url);
        const data = await res.json();
        const row = data && data.msgArray && data.msgArray[0];
        if(row && row.z && row.z !== '-'){
          const price = parseFloat(row.z);
          const prevClose = parseFloat(row.y);
          state.prices[t] = price;
          if(prevClose) state.chg[t] = ((price - prevClose)/prevClose)*100;
          okCount++;
        } else { failCount++; }
      } else {
        const url = `https://finnhub.io/api/v1/quote?symbol=${t}&token=${state.finnhubKey}`;
        const res = await fetch(url);
        const data = await res.json();
        if(data && data.c){
          state.prices[t] = data.c;
          state.chg[t] = data.dp;
          okCount++;
        } else { failCount++; }
      }
    }catch(e){ failCount++; }
  }
  btn.textContent = isClaudeEnv ? '抓取即時報價（需先在設定分頁完成）' : '抓取即時報價';
  if(okCount){ await persist(); renderAll(); }
  if(failCount && okCount){
    showToast(`更新了 ${okCount} 檔，${failCount} 檔失敗（可能是台股 CORS 限制）`);
  } else if(failCount && !okCount){
    showToast('抓取失敗，請確認 API Key 或改用批次貼上更新');
  } else {
    showToast(`已更新 ${okCount} 檔即時報價`);
  }
}

    const type = document.getElementById('txType').value;
    const t = document.getElementById('txTicker').value.trim().toUpperCase();
    const shares = parseFloat(document.getElementById('txShares').value)||0;
    const price = parseFloat(document.getElementById('txPrice').value)||0;

    state.txs.push({id:uid(), d, account, type, t, shares, price, fee});

    persist(); renderAll();

    btn.onclick = ()=>{
      state.txs = state.txs.filter(x=>x.id !== btn.dataset.id);
      persist(); renderAll();
    };
  });
}

    btn.onclick = ()=>{
      state.divs = state.divs.filter(x=>x.id !== btn.dataset.id);
      persist(); renderAll();
    };
  });
}

let trendChartInstance = null;
let currentPeriod = '3M';

function filterByPeriod(period){
  const last = new Date(trendData[trendData.length-1].d);
  let start;
  if(period === '1M'){ start = new Date(last); start.setMonth(start.getMonth()-1); }
  else if(period === '3M'){ start = new Date(last); start.setMonth(start.getMonth()-3); }
  else if(period === '6M'){ start = new Date(last); start.setMonth(start.getMonth()-6); }
  else if(period === 'YTD'){ start = new Date(last.getFullYear(), 0, 1); }
  return trendData.filter(x => new Date(x.d) >= start);
}

function labelOf(iso){ const [y,m,d] = iso.split('-'); return m+'/'+d; }

function drawChart(period){
  period = period || currentPeriod;
  currentPeriod = period;
  const data = filterByPeriod(period);

  let usMaxI=0, usMinI=0, twMaxI=0, twMinI=0;
  data.forEach((x,i)=>{
    if(x.us > data[usMaxI].us) usMaxI = i;
    if(x.us < data[usMinI].us) usMinI = i;
    if(x.tw > data[twMaxI].tw) twMaxI = i;
    if(x.tw < data[twMinI].tw) twMinI = i;
  });

  const usPointR = data.map((_,i)=> (i===usMaxI||i===usMinI) ? 5 : 0);
  const usPointC = data.map((_,i)=> i===usMaxI ? '#B4362A' : i===usMinI ? '#7A9BC4' : '#B4362A');
  const twPointR = data.map((_,i)=> (i===twMaxI||i===twMinI) ? 5 : 0);
  const twPointC = data.map((_,i)=> i===twMaxI ? '#B4362A' : i===twMinI ? '#7A9BC4' : '#2358A8');

  if(trendChartInstance){ trendChartInstance.destroy(); }
  const ctx = document.getElementById('trendChart').getContext('2d');
  trendChartInstance = new Chart(ctx, {
    type:'line',
    data:{ labels: data.map(d=>labelOf(d.d)), datasets:[
      {label:'美股市值', data: data.map(d=>d.us), borderColor:'#B4362A', backgroundColor:'transparent', tension:0.25, pointRadius: usPointR, pointBackgroundColor: usPointC, pointBorderColor: usPointC, borderWidth:2},
      {label:'台股市值', data: data.map(d=>d.tw), borderColor:'#2358A8', backgroundColor:'transparent', tension:0.25, pointRadius: twPointR, pointBackgroundColor: twPointC, pointBorderColor: twPointC, borderWidth:2}
    ]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{display:false} },
      scales:{
        x:{ ticks:{ maxTicksLimit:6, font:{family:"'JetBrains Mono',monospace", size:10}, color:'#6B7186' }, grid:{ display:false } },
        y:{ ticks:{ callback:v=>(v/10000).toFixed(0)+'萬', font:{family:"'JetBrains Mono',monospace", size:10}, color:'#6B7186' }, grid:{ color:'#DDD3B4' } }
      }
    }
  });

  document.getElementById('hiloGrid').innerHTML = `
    <div class="hilo-card">
      <div class="hilo-title">美股市值（TWD）</div>
      <div class="hilo-line" style="color:var(--red)"><span>最高</span><span>NT$ ${fmt(data[usMaxI].us)}（${labelOf(data[usMaxI].d)}）</span></div>
      <div class="hilo-line" style="color:#7A9BC4"><span>最低</span><span>NT$ ${fmt(data[usMinI].us)}（${labelOf(data[usMinI].d)}）</span></div>
    </div>
    <div class="hilo-card">
      <div class="hilo-title">台股市值（TWD）</div>
      <div class="hilo-line" style="color:var(--red)"><span>最高</span><span>NT$ ${fmt(data[twMaxI].tw)}（${labelOf(data[twMaxI].d)}）</span></div>
      <div class="hilo-line" style="color:#7A9BC4"><span>最低</span><span>NT$ ${fmt(data[twMinI].tw)}（${labelOf(data[twMinI].d)}）</span></div>
    </div>
  `;
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=> t.classList.remove('show'), 3200);
}
document.getElementById('refreshBtn').addEventListener('click', async ()=>{
  const msg = '請幫我重新同步 Google 試算表最新資料，並更新這個 App';
  try{
    await navigator.clipboard.writeText(msg);
    showToast('已複製提示訊息，貼到對話框給 Claude 即可同步');
  }catch(e){
    showToast('請在對話框跟 Claude 說：「請重新同步試算表」');
  }
});
